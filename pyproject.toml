[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papercut"
version = "0.1.0"
description = "Capture the friction agents route around silently, then mine it into ranked, tracked fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StartupBros / House of Vibe", email = "hello@houseofvibe.ai" }]
keywords = ["claude-code", "agents", "telemetry", "friction", "house-of-vibe"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
# Zero runtime dependencies is a contract, enforced by scripts/check_stdlib_only.py.
dependencies = []

[project.urls]
Homepage = "https://houseofvibe.ai"
Repository = "https://github.com/StartupBros-com/papercut"

[project.scripts]
papercut = "papercut.cli:main"

[tool.setuptools]
packages = ["papercut"]
